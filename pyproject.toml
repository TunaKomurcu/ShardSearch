[project]
name = "shardsearch"
version = "0.1.0"
description = "Sıfırdan inşa edilmiş, dağıtık çalışabilen bir öğrenme amaçlı arama motoru"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# SADECE tests/validation/ içinde referans olarak kullanılır — src/ asla
# import etmez (bkz. tests/validation/test_rank_bm25_izolasyonu.py).
# Ayrı grupta tutulduğu için `uv sync` (validation belirtilmeden) bunu kurmaz.
validation = [
    "rank_bm25>=0.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shardsearch"]
