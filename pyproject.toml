[project]
name = "shardsearch"
version = "0.1.0"
description = "A distributed text search engine built from scratch — inverted index, BM25, consistent hashing, and async fan-out, with no off-the-shelf search library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    # No real Redis/Docker/WSL available in this environment (see
    # docs/known-limitations.md) — used as a stand-in for real Redis in
    # tests. Never imported by src/ (see test_fakeredis_isolation.py).
    "fakeredis>=2.20",
]
# Used ONLY inside tests/validation/ as a reference — never imported by
# src/ (see tests/validation/test_rank_bm25_isolation.py). Kept in a
# separate group so a plain `uv sync` (without validation) doesn't install it.
validation = [
    "rank_bm25>=0.2.2",
]
# Needed ONLY to run benchmarks/locustfile.py — never imported by src/.
# Kept in a separate group so a plain `uv sync` doesn't install it, only
# `uv sync --group loadtest` does.
loadtest = [
    "locust>=2.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shardsearch"]
